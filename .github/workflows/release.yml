# Builds the addon zip when a version tag (for example v1.0.0) is pushed and publishes it as a GitHub release.
# It uploads to CurseForge too once the TOC has "## X-Curse-Project-ID" and the repository has the secret
# CF_API_KEY (CurseForge > account > API tokens).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
